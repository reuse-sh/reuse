<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reuse native carousel and lightbox</title>
  <link rel="stylesheet" href="/modules/carousel/styles.css">
  <link rel="stylesheet" href="/modules/lightbox/base.css">
  <link rel="stylesheet" href="/modules/lightbox/theme.css">
  <style>
    @font-face { font-family:Geist; src:url('/fonts/geist.woff2') format('woff2'); font-weight:100 900; font-display:swap; }
    * { box-sizing:border-box; }
    body { margin:0; padding:28px; background:#fcfcfc; font:14px Geist,sans-serif; color:#292929; }
    h1 { font-size:17px; font-weight:500; margin:0 0 24px; }
    .re-carousel { --re-carousel-gap:10px; --re-carousel-slide-width:67%; }
    .re-carousel__slide { display:block; border-radius:10px; overflow:hidden; }
    .re-carousel__slide img { display:block; width:100%; height:245px; object-fit:cover; }
    .controls { display:flex; justify-content:space-between; align-items:center; gap:15px; margin-top:22px; }
    button { font:inherit; color:inherit; border:1px solid #ddd; border-radius:7px; padding:8px 12px; background:white; cursor:pointer; }
    button:focus-visible,a:focus-visible { outline:2px solid #333; outline-offset:4px; }
    p { color:#737373; font-size:11px; line-height:1.7; }
    output { font-size:12px; font-variant-numeric:tabular-nums; }
  </style>
  <script type="importmap">{"imports":{"@reuse-sh/carousel":"/modules/carousel/index.js","@reuse-sh/core/escape-html":"/modules/core/escape-html.js","@reuse-sh/loaders":"/modules/loaders/index.js"}}</script>
</head>
<body>
  <h1>The same modules. No React.</h1>
  <section class="re-carousel" data-native-gallery aria-label="Native image carousel">
    <a class="re-carousel__slide" data-carousel-slide href="/photos/pink-summit-2560.jpg"><img src="/photos/pink-summit-1280.jpg" srcset="/photos/pink-summit-640.jpg 640w, /photos/pink-summit-1280.jpg 1280w, /photos/pink-summit-2560.jpg 2560w" sizes="(max-width: 48rem) 80vw, 40rem" alt="A mountain rises from pink haze" width="2560" height="1707" loading="lazy"></a>
    <a class="re-carousel__slide" data-carousel-slide href="/photos/open-sea-2560.jpg"><img src="/photos/open-sea-1280.jpg" srcset="/photos/open-sea-640.jpg 640w, /photos/open-sea-1280.jpg 1280w, /photos/open-sea-2560.jpg 2560w" sizes="(max-width: 48rem) 80vw, 40rem" alt="A calm deep blue sea under a pale sky" width="2560" height="1707" loading="lazy"></a>
    <a class="re-carousel__slide" data-carousel-slide href="/photos/dunes-2560.jpg"><img src="/photos/dunes-1280.jpg" srcset="/photos/dunes-640.jpg 640w, /photos/dunes-1280.jpg 1280w, /photos/dunes-2560.jpg 2560w" sizes="(max-width: 48rem) 80vw, 40rem" alt="Smooth sand dunes under a light sky" width="2560" height="1707" loading="lazy"></a>
    <a class="re-carousel__slide" data-carousel-slide href="/photos/lone-pine-2560.jpg"><img src="/photos/lone-pine-1280.jpg" srcset="/photos/lone-pine-640.jpg 640w, /photos/lone-pine-1280.jpg 1280w, /photos/lone-pine-2560.jpg 2560w" sizes="(max-width: 48rem) 80vw, 40rem" alt="A single pine on a snowy field" width="2560" height="1707" loading="lazy"></a>
    <a class="re-carousel__slide" data-carousel-slide href="/photos/sailboat-2560.jpg"><img src="/photos/sailboat-1280.jpg" srcset="/photos/sailboat-640.jpg 640w, /photos/sailboat-1280.jpg 1280w, /photos/sailboat-2560.jpg 2560w" sizes="(max-width: 48rem) 80vw, 40rem" alt="A small sailboat on a calm, deep blue sea at sunset" width="2560" height="1707" loading="lazy"></a>
    <a class="re-carousel__slide" data-carousel-slide href="/photos/cloud-peak-2560.jpg"><img src="/photos/cloud-peak-1280.jpg" srcset="/photos/cloud-peak-640.jpg 640w, /photos/cloud-peak-1280.jpg 1280w, /photos/cloud-peak-2560.jpg 2560w" sizes="(max-width: 48rem) 80vw, 40rem" alt="A dark peak under low cloud" width="2560" height="1707" loading="lazy"></a>
  </section>
  <div class="controls"><output data-current aria-live="polite">1 / 6</output><div><button type="button" data-previous>Previous</button> <button type="button" data-next>Next</button></div></div>
  <p>Drag or scroll the carousel. Open a photograph to use the native viewer.</p>
  <script type="module">
    import { createCarousel } from '/modules/carousel/index.js';
    import { bindLightboxGallery, createLightbox } from '/modules/lightbox/index.js';

    const root = document.querySelector('[data-native-gallery]');
    const carousel = createCarousel(root, { align:'center', loop:true });
    const lightbox = createLightbox({ thumbnails:"bottom" });
    const unbind = bindLightboxGallery(root, lightbox);
    document.querySelector('[data-next]').addEventListener('click', () => carousel.next());
    document.querySelector('[data-previous]').addEventListener('click', () => carousel.prev());
    const unsubscribe = carousel.subscribe(state => { document.querySelector('[data-current]').textContent = `${state.index + 1} / ${state.count}`; });
    window.addEventListener('pagehide', event => { if (!event.persisted) { unsubscribe(); unbind(); lightbox.destroy(); carousel.destroy(); } });
  </script>
</body>
</html>
