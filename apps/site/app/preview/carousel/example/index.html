<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Print carousel</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./main.js"></script>
  </head>
  <body style="margin: 0">
    <section class="re-print-carousel" aria-label="Print collection">
      <!-- biome-ignore lint/a11y/noNoninteractiveTabindex: the scroll region needs keyboard focus without JavaScript. -->
      <section class="re-carousel" aria-label="Art prints" tabindex="0" data-prints>
        <figure class="re-carousel__slide re-print-slide" data-carousel-slide>
          <a href="https://reuse.sh/images/marble-lake.svg">
            <img src="https://reuse.sh/images/marble-lake.svg" alt="A soft marble texture in coral, sand and blue" width="1600" height="1200" draggable="false" />
          </a>
          <figcaption>Coral sky</figcaption>
        </figure>
        <figure class="re-carousel__slide re-print-slide" data-carousel-slide>
          <a href="https://reuse.sh/images/marble-mountains.svg">
            <img src="https://reuse.sh/images/marble-mountains.svg" alt="A soft marble texture in mint, blue and orange" width="1600" height="1200" draggable="false" />
          </a>
          <figcaption>Mint and ember</figcaption>
        </figure>
        <figure class="re-carousel__slide re-print-slide" data-carousel-slide>
          <a href="https://reuse.sh/images/marble-coast.svg">
            <img src="https://reuse.sh/images/marble-coast.svg" alt="A soft marble texture in lilac, rose and sea green" width="1600" height="1200" draggable="false" />
          </a>
          <figcaption>Lilac bloom</figcaption>
        </figure>
        <figure class="re-carousel__slide re-print-slide" data-carousel-slide>
          <a href="https://reuse.sh/images/marble-forest.svg">
            <img src="https://reuse.sh/images/marble-forest.svg" alt="A soft marble texture in sand, green and violet" width="1600" height="1200" draggable="false" />
          </a>
          <figcaption>Sand and fern</figcaption>
        </figure>
        <figure class="re-carousel__slide re-print-slide" data-carousel-slide>
          <a href="https://reuse.sh/images/marble-night.svg">
            <img src="https://reuse.sh/images/marble-night.svg" alt="A soft marble texture in blue, lilac and gold" width="1600" height="1200" draggable="false" />
          </a>
          <figcaption>Blue hour</figcaption>
        </figure>
        <figure class="re-carousel__slide re-print-slide" data-carousel-slide>
          <a href="https://reuse.sh/images/marble-woods.svg">
            <img src="https://reuse.sh/images/marble-woods.svg" alt="A soft marble texture in orange, yellow and blue" width="1600" height="1200" draggable="false" />
          </a>
          <figcaption>Amber</figcaption>
        </figure>
      </section>
      <div class="re-print-controls">
        <span class="re-print-counter" aria-live="polite" aria-atomic="true" data-counter>6 prints</span>
        <div class="re-print-arrows">
          <button type="button" aria-label="Previous slide" data-previous disabled>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 5-7 7 7 7M5 12h14" /></svg>
          </button>
          <button type="button" aria-label="Next slide" data-next disabled>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 5 7 7-7 7M5 12h14" /></svg>
          </button>
        </div>
      </div>
    </section>
  </body>
</html>
