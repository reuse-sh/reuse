<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>highlight-tabs</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body
    style="margin:0;font:15px/24px Geist,system-ui,sans-serif;letter-spacing:-0.006em"
  >
    <main class="re-example">
      <div class="re-highlight-tabs-x-app re-highlight-tabs-x-app-tabs">
        <header class="re-highlight-tabs-x-tabs-head">
          <h2 class="re-highlight-tabs-x-tabs-title">Spring catalogue</h2>
          <div
            role="tablist"
            aria-label="Project"
            class="re-highlight-tabs-x-tabs"
          >
            <button
              id="x-tab-0"
              type="button"
              role="tab"
              class="re-highlight-tabs-x-tab"
              aria-selected="true"
              aria-controls="re-highlight-tabs-x-tab-panel"
              tabindex="0"
            >
              Overview
            </button><button
              id="x-tab-1"
              type="button"
              role="tab"
              class="re-highlight-tabs-x-tab"
              aria-selected="false"
              aria-controls="re-highlight-tabs-x-tab-panel"
              tabindex="-1"
            >
              Prints
            </button><button
              id="x-tab-2"
              type="button"
              role="tab"
              class="re-highlight-tabs-x-tab"
              aria-selected="false"
              aria-controls="re-highlight-tabs-x-tab-panel"
              tabindex="-1"
            >
              Orders
            </button><button
              id="x-tab-3"
              type="button"
              role="tab"
              class="re-highlight-tabs-x-tab"
              aria-selected="false"
              aria-controls="re-highlight-tabs-x-tab-panel"
              tabindex="-1"
            >
              Settings
            </button>
          </div>
        </header>
        <div
          id="re-highlight-tabs-x-tab-panel"
          role="tabpanel"
          aria-labelledby="x-tab-0"
          class="re-highlight-tabs-x-tab-panel"
        >
          Nine prints, two waiting for review. The next proof ships on Friday.
        </div>
      </div>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
