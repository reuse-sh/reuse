<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Highlight Tabs</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<main class="re-example"><h2 class="re-heading">Spring catalogue</h2><div class="re-surface re-tabs" id="highlight" role="tablist" aria-label="Project"><button type="button" class="re-control " data-re-row role="tab" tabindex="0" id="tab-0" aria-selected="true" aria-controls="panel-0">Overview</button><button type="button" class="re-control " data-re-row role="tab" tabindex="-1" id="tab-1" aria-selected="false" aria-controls="panel-1">Prints</button><button type="button" class="re-control " data-re-row role="tab" tabindex="-1" id="tab-2" aria-selected="false" aria-controls="panel-2">Orders</button><button type="button" class="re-control " data-re-row role="tab" tabindex="-1" id="tab-3" aria-selected="false" aria-controls="panel-3">Settings</button></div><section id="panel-0" role="tabpanel" aria-labelledby="tab-0"><p class="re-prose">Nine prints, two waiting for review. The next proof ships on Friday.</p></section><section id="panel-1" role="tabpanel" aria-labelledby="tab-1" hidden><p class="re-prose">Coral sky, Mint and ember, Lilac bloom and six more, in print order.</p></section><section id="panel-2" role="tabpanel" aria-labelledby="tab-2" hidden><p class="re-prose">14 orders this week. Three are framed and wait for the courier.</p></section><section id="panel-3" role="tabpanel" aria-labelledby="tab-3" hidden><p class="re-prose">Who can see the series, how prints are named, and where proofs go.</p></section></main>
<script type="module" src="./main.js"></script>
</body>
</html>
