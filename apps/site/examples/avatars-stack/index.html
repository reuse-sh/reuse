<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Avatars Stack</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body
    style="margin:0;font:15px/24px Geist,system-ui,sans-serif;letter-spacing:-0.006em"
  >
    <div class="re-example re-stack-stage w-full min-w-0">
      <fieldset
        aria-label="9 people"
        class="re-avatar-group re-stack"
        style="margin: 0px; padding: 0px; min-width: 0px; border: 0px;"
      >
        <span
          class="re-avatar"
          role="img"
          aria-label="Mara Lind"
          data-re-avatar=""
          style="--re-avatar-size:48px"
          ><span
            class="re-avatar-face"
            data-re-avatar-face=""
            aria-hidden="true"
            >ML<img
              class="re-avatar-image"
              src="https://reuse.sh/images/marble-lake.svg"
              alt=""
              decoding="async"
            ></span
          ></span
        ><span
          class="re-avatar"
          role="img"
          aria-label="Jonas Weber"
          data-re-avatar=""
          style="--re-avatar-size:48px"
          ><span
            class="re-avatar-face"
            data-re-avatar-face=""
            aria-hidden="true"
            >JW<img
              class="re-avatar-image"
              src="https://reuse.sh/images/marble-mountains.svg"
              alt=""
              decoding="async"
            ></span
          ></span
        ><span
          class="re-avatar"
          role="img"
          aria-label="Lea Novak"
          data-re-avatar=""
          style="--re-avatar-size:48px"
          ><span
            class="re-avatar-face"
            data-re-avatar-face=""
            aria-hidden="true"
            >LN<img
              class="re-avatar-image"
              src="https://reuse.sh/images/marble-coast.svg"
              alt=""
              decoding="async"
            ></span
          ></span
        ><span
          class="re-avatar"
          role="img"
          aria-label="Aiko Tanaka, and 5 more"
          data-re-avatar=""
          style="--re-avatar-size:48px"
          ><span
            class="re-avatar-face"
            data-re-avatar-face=""
            aria-hidden="true"
            >AT<img
              class="re-avatar-image"
              src="https://reuse.sh/images/marble-forest.svg"
              alt=""
              decoding="async"
            ></span
          ><span
            class="re-avatar-badge"
            data-re-avatar-badge="count"
            data-corner="bottom-right"
            aria-hidden="true"
            >5</span
          ></span
        >
      </fieldset>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
