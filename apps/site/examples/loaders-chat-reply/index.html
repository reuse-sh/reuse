<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Loaders Chat Reply</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body
    style="margin:0;font:15px/24px Geist,system-ui,sans-serif;letter-spacing:-0.006em"
  >
    <div class="re-example re-chat">
      <div class="re-chat-messages">
        <div class="re-chat-turn">
          <p class="re-chat-question">Which frame suits Coral sky?</p>
          <div class="re-chat-answer">
            A thin oak frame keeps the sand tones warm. Black would pull the
            blue forward and make the print feel cooler.
          </div>
        </div>
      </div>
      <form class="re-chat-compose">
        <input aria-label="Next question" readonly value="And for Blue hour?">
        <button type="submit" aria-label="Send" disabled>
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            aria-hidden="true"
          >
            <path
              d="M12 19V5m0 0-6 6m6-6 6 6"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
      </form>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
