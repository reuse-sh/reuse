<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Gradients Start</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body
    style="margin:0;font:15px/24px Geist,system-ui,sans-serif;letter-spacing:-0.006em"
  >
    <div class="re-example re-gradient-start">
      <div aria-hidden="true">
        <span></span><span>Linear</span><span>Eased</span>
      </div>
      <div>
        <span>Ink</span
        ><span
          class="re-gradient-swatch"
          data-easing="linear"
          role="img"
          aria-label="Ink, linear fade from transparent"
        ></span><span
          class="re-gradient-swatch"
          data-easing="ease-in-out-sine"
          role="img"
          aria-label="Ink, eased fade from transparent"
        ></span>
      </div>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
