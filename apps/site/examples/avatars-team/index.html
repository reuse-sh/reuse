<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Avatars Team</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body
    style="margin:0;font:15px/24px Geist,system-ui,sans-serif;letter-spacing:-0.006em"
  >
    <div class="re-example w-full min-w-0">
      <div
        class="re-members mx-auto w-full max-w-[400px] [--re-highlight-background:var(--re-demo-hover)] [--re-highlight-radius:12px]"
      >
        <ul
          class="re-member-list [display:grid] [padding:6px]"
          aria-label="Members"
        >
          <li
            class="re-member [display:grid] [grid-template-columns:36px_minmax(0,_1fr)] [align-items:center] [gap:12px] [padding:9px_10px] [border-radius:12px]"
            data-re-row=""
          >
            <span
              class="re-avatar"
              role="img"
              aria-label="Mara Lind, Online"
              data-re-avatar=""
              style="--re-avatar-size:36px"
              ><span
                class="re-avatar-face"
                data-re-avatar-face=""
                aria-hidden="true"
                >ML<img
                  class="re-avatar-image"
                  src="https://reuse.sh/images/marble-lake.svg"
                  alt=""
                  decoding="async"
                ></span
              ><span
                class="re-avatar-badge"
                data-re-avatar-badge="dot"
                data-corner="bottom-right"
                aria-hidden="true"
              ></span></span
            ><span class="re-member-text [display:grid] [min-width:0]"
              ><b
                class="re-member-name [font-size:14px] [line-height:20px] [font-weight:540]"
                >Mara Lind</b
              ><small
                class="re-member-meta [font-size:12.5px] [line-height:18px] [color:var(--re-demo-mute)]"
                >Print editor</small
              ></span
            >
          </li>
          <li
            class="re-member [display:grid] [grid-template-columns:36px_minmax(0,_1fr)] [align-items:center] [gap:12px] [padding:9px_10px] [border-radius:12px]"
            data-re-row=""
          >
            <span
              class="re-avatar"
              role="img"
              aria-label="Jonas Weber, Away"
              data-re-avatar=""
              style="--re-avatar-status-color:#d08a1c;--re-avatar-size:36px"
              ><span
                class="re-avatar-face"
                data-re-avatar-face=""
                aria-hidden="true"
                >JW<img
                  class="re-avatar-image"
                  src="https://reuse.sh/images/marble-mountains.svg"
                  alt=""
                  decoding="async"
                ></span
              ><span
                class="re-avatar-badge"
                data-re-avatar-badge="dot"
                data-corner="bottom-right"
                aria-hidden="true"
              ></span></span
            ><span class="re-member-text [display:grid] [min-width:0]"
              ><b
                class="re-member-name [font-size:14px] [line-height:20px] [font-weight:540]"
                >Jonas Weber</b
              ><small
                class="re-member-meta [font-size:12.5px] [line-height:18px] [color:var(--re-demo-mute)]"
                >Producer</small
              ></span
            >
          </li>
          <li
            class="re-member [display:grid] [grid-template-columns:36px_minmax(0,_1fr)] [align-items:center] [gap:12px] [padding:9px_10px] [border-radius:12px]"
            data-re-row=""
          >
            <span
              class="re-avatar"
              role="img"
              aria-label="Aiko Tanaka, 3 unread messages"
              data-re-avatar=""
              style="--re-avatar-size:36px"
              ><span
                class="re-avatar-face"
                data-re-avatar-face=""
                aria-hidden="true"
                >AT<img
                  class="re-avatar-image"
                  src="https://reuse.sh/images/marble-coast.svg"
                  alt=""
                  decoding="async"
                ></span
              ><span
                class="re-avatar-badge"
                data-re-avatar-badge="count"
                data-corner="bottom-right"
                aria-hidden="true"
                >3</span
              ></span
            ><span class="re-member-text [display:grid] [min-width:0]"
              ><b
                class="re-member-name [font-size:14px] [line-height:20px] [font-weight:540]"
                >Aiko Tanaka</b
              ><small
                class="re-member-meta [font-size:12.5px] [line-height:18px] [color:var(--re-demo-mute)]"
                >Writer</small
              ></span
            >
          </li>
          <li
            class="re-member [display:grid] [grid-template-columns:36px_minmax(0,_1fr)] [align-items:center] [gap:12px] [padding:9px_10px] [border-radius:12px]"
            data-re-row=""
          >
            <span
              class="re-avatar"
              role="img"
              aria-label="Lea Novak, Verified"
              data-re-avatar=""
              style="--re-avatar-size:36px"
              ><span
                class="re-avatar-face"
                data-re-avatar-face=""
                aria-hidden="true"
                >LN<img
                  class="re-avatar-image"
                  src="https://reuse.sh/images/marble-forest.svg"
                  alt=""
                  decoding="async"
                ></span
              ><span
                class="re-avatar-badge"
                data-re-avatar-badge="icon"
                data-corner="bottom-right"
                aria-hidden="true"
                ><svg
                  width="10"
                  height="10"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.6"
                  aria-hidden="true"
                >
                  <path
                    d="M5 14L8.5 17.5L19 6.5"
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="1.6"
                  ></path>
                </svg></span
              ></span
            ><span class="re-member-text [display:grid] [min-width:0]"
              ><b
                class="re-member-name [font-size:14px] [line-height:20px] [font-weight:540]"
                >Lea Novak</b
              ><small
                class="re-member-meta [font-size:12.5px] [line-height:18px] [color:var(--re-demo-mute)]"
                >Owner</small
              ></span
            >
          </li>
          <li
            class="re-member [display:grid] [grid-template-columns:36px_minmax(0,_1fr)] [align-items:center] [gap:12px] [padding:9px_10px] [border-radius:12px]"
            data-re-row=""
          >
            <span
              class="re-avatar"
              role="img"
              aria-label="Theo Brandt"
              data-re-avatar=""
              style="--re-avatar-size:36px"
              ><span
                class="re-avatar-face"
                data-re-avatar-face=""
                aria-hidden="true"
                >TB<img
                  class="re-avatar-image"
                  src="https://reuse.sh/images/marble-night.svg"
                  alt=""
                  decoding="async"
                ></span
              ></span
            ><span class="re-member-text [display:grid] [min-width:0]"
              ><b
                class="re-member-name [font-size:14px] [line-height:20px] [font-weight:540]"
                >Theo Brandt</b
              ><small
                class="re-member-meta [font-size:12.5px] [line-height:18px] [color:var(--re-demo-mute)]"
                >Framer</small
              ></span
            >
          </li>
          <li
            class="re-member [display:grid] [grid-template-columns:36px_minmax(0,_1fr)] [align-items:center] [gap:12px] [padding:9px_10px] [border-radius:12px]"
            data-re-row=""
          >
            <span
              class="re-avatar"
              role="img"
              aria-label="Ines Duarte, 12 unread messages"
              data-re-avatar=""
              style="--re-avatar-size:36px"
              ><span
                class="re-avatar-face"
                data-re-avatar-face=""
                aria-hidden="true"
                >ID<img
                  class="re-avatar-image"
                  src="https://reuse.sh/images/marble-woods.svg"
                  alt=""
                  decoding="async"
                ></span
              ><span
                class="re-avatar-badge"
                data-re-avatar-badge="count"
                data-corner="bottom-right"
                aria-hidden="true"
                >12</span
              ></span
            ><span class="re-member-text [display:grid] [min-width:0]"
              ><b
                class="re-member-name [font-size:14px] [line-height:20px] [font-weight:540]"
                >Ines Duarte</b
              ><small
                class="re-member-meta [font-size:12.5px] [line-height:18px] [color:var(--re-demo-mute)]"
                >Guest</small
              ></span
            >
          </li>
        </ul>
      </div>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
