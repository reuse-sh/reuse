<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Gradients Image Caption</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body
    style="margin:0;font:15px/24px Geist,system-ui,sans-serif;letter-spacing:-0.006em"
  >
    <div class="re-example">
      <div class="re-controls">
        <fieldset class="re-choices">
          <legend>Scrim curve</legend>
          <label data-re-row data-current
            ><input
              type="radio"
              name="scrim-curve"
              value="eased"
              checked
              disabled
            >eased</label
          ><label data-re-row
            ><input
              type="radio"
              name="scrim-curve"
              value="linear"
              disabled
            >linear</label
          >
        </fieldset>
      </div>
      <figure class="re-caption">
        <img
          src="https://reuse.sh/images/marble-forest.svg"
          alt="A soft marble texture in sand, green and violet"
          width="1600"
          height="1200"
        >
        <figcaption>
          <b>Sand and fern</b
          ><span>Marble print on cotton paper, 50 × 70 cm, edition of 30</span>
        </figcaption>
      </figure>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
