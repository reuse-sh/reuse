<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Annotations Review Notes</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body
    style="margin:0;font:15px/24px Geist,system-ui,sans-serif;letter-spacing:-0.006em"
  >
    <div class="re-example w-full min-w-0">
      <article class="re-review ">
        <header
          class="re-review-head [display:flex] [align-items:center] [gap:12px] [margin-bottom:18px]"
        >
          <span
            class="re-avatar"
            role="img"
            aria-label="Aiko Tanaka"
            data-re-avatar=""
            style="--re-avatar-size:32px"
            ><span
              class="re-avatar-face"
              data-re-avatar-face=""
              aria-hidden="true"
              >AT<img
                class="re-avatar-image"
                src="https://reuse.sh/images/marble-forest.svg"
                alt=""
                decoding="async"
              ></span
            ></span
          >
          <p
            class="re-review-meta [display:grid] [font-size:14px] [line-height:20px] [color:var(--re-demo-prose)]"
          >
            <span><b>Aiko Tanaka</b> reviewed proof 3 of Mint and ember</span
            ><small>Six notes · Tuesday 14:10</small>
          </p>
        </header>
        <div
          class="re-annot [--re-annotation-color:#d95746] [--re-annotation-radius:10px] [font-size:13px]"
        >
          <figure data-re-annotations>
            <div
              data-annot-stage
              style="--annot-left: 0px; --annot-right: 150px; --annot-top: 0px; --annot-bottom: 0px"
            >
              <div data-annot-media>
                <img
                  src="https://reuse.sh/images/marble-mountains.svg"
                  alt="A soft marble texture in mint, blue and orange, with six review notes"
                >
                <div data-annotation-overlay>
                  <span data-annot-shade="" aria-hidden="true"
                    ><svg aria-hidden="true">
                      <defs>
                        <mask id="re-image-_R_2_">
                          <rect width="100%" height="100%" fill="white"></rect>
                          <rect
                            x="56%"
                            y="50%"
                            width="28%"
                            height="32%"
                            rx="6"
                            fill="black"
                          ></rect>
                        </mask>
                      </defs>
                      <rect
                        width="100%"
                        height="100%"
                        mask="url(#re-image-_R_2_)"
                      ></rect>
                    </svg></span
                  ><span
                    data-annot-spotlight=""
                    data-index="1"
                    style="left: 56%; top: 50%; width: 28%; height: 32%"
                  ></span><span
                    data-annot-area=""
                    data-index="0"
                    style="left: 7%; top: 10%; width: 30%; height: 32%"
                    ><span data-annot-tag="">Bands too tight</span></span
                  ><span
                    data-annot-shape="arrow"
                    data-index="2"
                    data-line="38 82 54 68"
                    style="left: 38%; top: 82%; width: 19.1%; --angle: -33.3deg"
                    aria-hidden="true"
                  ></span><span
                    data-annot-shape="line"
                    data-index="3"
                    data-line="8 90 44 90"
                    style="left: 8%; top: 90%; width: 36%; --angle: 0deg"
                    aria-hidden="true"
                  ></span><span
                    data-annot-marker=""
                    data-pointer=""
                    data-index="4"
                    style="left: 76%; top: 24%"
                    aria-hidden="true"
                    >2</span
                  ><span
                    data-annot-marker=""
                    data-index="5"
                    style="left: 24%; top: 60%"
                    aria-hidden="true"
                    >1</span
                  >
                </div>
              </div>
              <svg
                data-annot-drawing=""
                data-pointers='[[4,76,24,"auto","Keep this orange"]]'
                data-ratio="1.3333"
                data-width="1600"
                viewBox="0 0 1750 1200"
                aria-hidden="true"
              >
                <g data-index="4">
                  <path data-annot-line="" d="M1216 288H1618"></path>
                  <path
                    data-annot-tip=""
                    d="M1216 283.5L1220.5 288L1216 292.5L1211.5 288Z"
                  ></path>
                  <text x="1624" y="288" text-anchor="start" font-size="14">
                    <tspan x="1624" dy="0">Keep this orange</tspan>
                  </text>
                </g>
              </svg>
            </div>
            <ol data-annot-list="">
              <li data-index="5" value="1">
                <span data-annot-text=""
                  >Lift the <strong>blue</strong> one step</span
                >
              </li>
              <li data-index="4" data-pointer="" value="2">
                <span data-annot-text="">Keep this orange</span>
              </li>
            </ol>
          </figure>
        </div>
      </article>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
