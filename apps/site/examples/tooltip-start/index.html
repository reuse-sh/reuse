<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>tooltip-start</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body
    style="margin:0;font:15px/24px Geist,system-ui,sans-serif;letter-spacing:-0.006em"
  >
    <main class="re-example">
      <div>
        <div
          class="re-tooltip-start-c-toolbar"
          role="toolbar"
          aria-label="Photo actions"
        >
          <button
            type="button"
            aria-label="Zoom in"
            data-re-row=""
            data-re-tooltip="Zoom in"
          >

              viewBox="0 0 24 24"
              fill="none"
              aria-hidden="true"

                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="1.5"
              ></path>
              <path
                d="M14.5 13.1217V17.1217M16.5 15.1217H12.5"
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="1.5"
              ></path>
              <path
                d="M10 3.62173H14M3 10.6217V14.6217M6.5 21.6217C4.567 21.6217 3 20.0547 3 18.1217M17.5 3.62173C19.433 3.62173 21 5.18873 21 7.12173M3 7.12173C3 5.18873 4.567 3.62173 6.5 3.62173"
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="1.5"
              ></path>
            </svg>
          </button><button
            type="button"
            aria-label="Add to favorites"

              viewBox="0 0 24 24"
              fill="none"
              aria-hidden="true"
            >

                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="1.5"
              ></path>

          </button><button

              fill="none"

                stroke-width="1.5"
              ></path>
            </svg>
          </button><button
            type="button"
            aria-label="Move to trash"

              height="18"
              viewBox="0 0 24 24"
              fill="none"

              ></path>
              <path
                d="M9.5 16.5L9.5 10.5"
                stroke="currentColor"
                stroke-linecap="round"
                stroke-width="1.5"
              ></path>
              <path
                d="M14.5 16.5L14.5 10.5"
                stroke="currentColor"
                stroke-linecap="round"
                stroke-width="1.5"
              ></path>

      </div>
    </main>
    <script type="module" src="./main.js"></script>

</html>
