<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tooltip Start</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<main class="re-example"><div class="re-surface"><div class="re-toolbar" role="toolbar" aria-label="Photo actions"><button type="button" class="re-control" aria-label="Zoom in" data-re-row data-re-tooltip="Zoom in">+</button><button type="button" class="re-control" aria-label="Add to favorites" data-re-row data-re-tooltip="Add to favorites">♡</button><button type="button" class="re-control" aria-label="Share" data-re-row data-re-tooltip="Share">↑</button><button type="button" class="re-control" aria-label="Copy link" data-re-row data-re-tooltip="Copy link">↗</button><button type="button" class="re-control" aria-label="Move to trash" data-re-row data-re-tooltip="Move to trash">×</button></div></div></main>
<script type="module" src="./main.js"></script>
</body>
</html>
