<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Shadows Scale</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body
    style="margin:0;font:15px/24px Geist,system-ui,sans-serif;letter-spacing:-0.006em"
  >
    <div class="re-example re-shadow-scale">
      <section>
        <h2><code class="re-scale-heading">re-shadow-*</code></h2>
        <div class="re-scale-frame">
          <div class="re-scale-stage">
            <ul>
              <li><span class="re-shadow-xs"></span><code>xs</code></li>
              <li><span class="re-shadow-sm"></span><code>sm</code></li>
              <li><span class="re-shadow-md"></span><code>md</code></li>
              <li><span class="re-shadow-lg"></span><code>lg</code></li>
              <li><span class="re-shadow-xl"></span><code>xl</code></li>
              <li><span class="re-shadow-2xl"></span><code>2xl</code></li>
            </ul>
          </div>
        </div>
      </section>
      <section>
        <h2><code class="re-scale-heading">re-shadow-ring-*</code></h2>
        <div class="re-scale-frame">
          <div class="re-scale-stage">
            <ul>
              <li><span class="re-shadow-ring-xs"></span><code>xs</code></li>
              <li><span class="re-shadow-ring-sm"></span><code>sm</code></li>
              <li><span class="re-shadow-ring-md"></span><code>md</code></li>
              <li><span class="re-shadow-ring-lg"></span><code>lg</code></li>
              <li><span class="re-shadow-ring-xl"></span><code>xl</code></li>
              <li><span class="re-shadow-ring-2xl"></span><code>2xl</code></li>
            </ul>
          </div>
        </div>
      </section>
    </div>
  </body>
</html>
