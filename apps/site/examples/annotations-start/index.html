<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Annotations Start</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body
    style="margin:0;font:15px/24px Geist,system-ui,sans-serif;letter-spacing:-0.006em"
  >
    <div
      class="re-example w-full min-w-0 [--re-annotation-color:#d95746] [--re-annotation-radius:12px] text-[13px]"
    >
      <div>
        <figure data-re-annotations>
          <div data-annot-stage>
            <div data-annot-media>
              <img
                src="https://reuse.sh/images/marble-lake.svg"
                alt="A soft marble texture in coral, sand and blue, with three annotations"
              >
              <div data-annotation-overlay>
                <span
                  data-annot-area=""
                  data-index="0"
                  style="left: 12%; top: 19%; width: 32%; height: 36%"
                  ><span data-annot-tag="">A quieter corner</span></span
                ><span
                  data-annot-shape="arrow"
                  data-index="1"
                  data-line="70 68 48 50"
                  style="left: 70%; top: 68%; width: 25.8%; --angle: -148.5deg"
                  aria-hidden="true"
                ></span><span
                  data-annot-marker=""
                  data-index="2"
                  style="left: 76%; top: 26%"
                  aria-hidden="true"
                  >1</span
                >
              </div>
            </div>
          </div>
          <ol data-annot-list="">
            <li data-index="2" value="1">
              <span data-annot-text=""
                >Keep <strong>context</strong> beside the image.</span
              >
            </li>
          </ol>
        </figure>
      </div>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
