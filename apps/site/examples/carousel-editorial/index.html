<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Carousel example</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body
    style="margin:0;font:15px/24px Geist,system-ui,sans-serif;letter-spacing:-0.006em"
  >
    <main class="re-example re-c-editorial">
      <article>
        <p class="re-c-date">Print series · October 2026</p>
        <h2>Six sheets from one tray</h2>
        <p class="re-c-text">
          The series started with one tray of water and six colors. These are
          the sheets we kept, in the order they were pulled.
        </p>
      </article>
      <div data-gallery>
        <section class="re-carousel" aria-label="Photos">
          <figure class="re-carousel__slide" data-carousel-slide>
            <a
              class="re-c-photo"
              href="https://reuse.sh/images/marble-night.svg"
              ><img
                src="https://reuse.sh/images/marble-night.svg"
                alt="A soft marble texture in blue, lilac and gold"
                width="1600"
                height="1200"
                draggable="false"
                data-caption="Blue hour"
              ></a
            >
            <figcaption>Blue hour</figcaption>
          </figure>
          <figure class="re-carousel__slide" data-carousel-slide>
            <a
              class="re-c-photo"
              href="https://reuse.sh/images/marble-mountains.svg"
              ><img
                src="https://reuse.sh/images/marble-mountains.svg"
                alt="A soft marble texture in mint, blue and orange"
                width="1600"
                height="1200"
                draggable="false"
                data-caption="Mint and ember"
              ></a
            >
            <figcaption>Mint and ember</figcaption>
          </figure>
          <figure class="re-carousel__slide" data-carousel-slide>
            <a class="re-c-photo" href="https://reuse.sh/images/marble-lake.svg"
              ><img
                src="https://reuse.sh/images/marble-lake.svg"
                alt="A soft marble texture in coral, sand and blue"
                width="1600"
                height="1200"
                draggable="false"
                data-caption="Coral sky"
              ></a
            >
            <figcaption>Coral sky</figcaption>
          </figure>
          <figure class="re-carousel__slide" data-carousel-slide>
            <a
              class="re-c-photo"
              href="https://reuse.sh/images/marble-forest.svg"
              ><img
                src="https://reuse.sh/images/marble-forest.svg"
                alt="A soft marble texture in sand, green and violet"
                width="1600"
                height="1200"
                draggable="false"
                data-caption="Sand and fern"
              ></a
            >
            <figcaption>Sand and fern</figcaption>
          </figure>
          <figure class="re-carousel__slide" data-carousel-slide>
            <a
              class="re-c-photo"
              href="https://reuse.sh/images/marble-woods.svg"
              ><img
                src="https://reuse.sh/images/marble-woods.svg"
                alt="A soft marble texture in orange, yellow and blue"
                width="1600"
                height="1200"
                draggable="false"
                data-caption="Amber"
              ></a
            >
            <figcaption>Amber</figcaption>
          </figure>
          <figure class="re-carousel__slide" data-carousel-slide>
            <a
              class="re-c-photo"
              href="https://reuse.sh/images/marble-coast.svg"
              ><img
                src="https://reuse.sh/images/marble-coast.svg"
                alt="A soft marble texture in lilac, rose and sea green"
                width="1600"
                height="1200"
                draggable="false"
                data-caption="Lilac bloom"
              ></a
            >
            <figcaption>Lilac bloom</figcaption>
          </figure>
        </section>
      </div>
      <div class="re-c-controls">
        <div class="re-c-dots" data-dots style="--re-c-dot:0">
          <button
            type="button"
            data-index="0"
            disabled
            aria-label="Show Blue hour"
            aria-current="true"
          ></button><button
            type="button"
            data-index="1"
            disabled
            aria-label="Show Mint and ember"
          ></button><button
            type="button"
            data-index="2"
            disabled
            aria-label="Show Coral sky"
          ></button><button
            type="button"
            data-index="3"
            disabled
            aria-label="Show Sand and fern"
          ></button><button
            type="button"
            data-index="4"
            disabled
            aria-label="Show Amber"
          ></button><button
            type="button"
            data-index="5"
            disabled
            aria-label="Show Lilac bloom"
          ></button>
        </div>
        <span class="re-c-counter" aria-live="polite">6 prints</span
        ><span class="re-c-arrows"
          ><button type="button" data-prev disabled aria-label="Previous slide">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="m12 19-7-7 7-7" />
              <path d="M19 12H5" />
            </svg>
          </button><button
            type="button"
            data-next
            disabled
            aria-label="Next slide"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M5 12h14" />
              <path d="m12 5 7 7-7 7" />
            </svg>
          </button></span
        >
      </div>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
