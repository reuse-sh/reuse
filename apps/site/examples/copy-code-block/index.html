<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>copy-code-block</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body
    style="margin:0;font:15px/24px Geist,system-ui,sans-serif;letter-spacing:-0.006em"
  >
    <main class="re-example">
      <div
        class="re-copy-code-block-x-copy-code re-card re-card-code re-shadow-ring-sm"
      >
        <pre
          class="re-copy-code-block-x-copy-pre"
        ><code><span class="re-copy-code-block-x-copy-prompt" aria-hidden="true">$ </span>npm install @reuse-sh/interactions</code></pre>
        <button
          type="button"
          disabled=""
          aria-label="Copy command"
          class="re-copy-button re-copy-code-block-c-copy re-copy-code-block-c-copy-icon"
        ></button>
      </div>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
