<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Highlight Start</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<main class="re-example"><div class="re-status" aria-hidden="true">File　 Edit　 View</div><div class="re-surface " id="highlight" role="menu" aria-label="File"><button type="button" class="re-control re-row" data-re-row role="menuitem" tabindex="0">New print<kbd class="re-key">⌘N</kbd></button><button type="button" class="re-control re-row" data-re-row role="menuitem" tabindex="-1">Duplicate<kbd class="re-key">⌘D</kbd></button><button type="button" class="re-control re-row" data-re-row role="menuitem" tabindex="-1">Copy link<kbd class="re-key">⌘L</kbd></button><button type="button" class="re-control re-row" data-re-row role="menuitem" tabindex="-1">Share<kbd class="re-key">⇧⌘S</kbd></button><button type="button" class="re-control re-row" data-re-row role="menuitem" tabindex="-1">Move to trash<kbd class="re-key">⌫</kbd></button></div><p class="re-status" role="status" id="status">Choose a file action.</p></main>
<script type="module" src="./main.js"></script>
</body>
</html>
