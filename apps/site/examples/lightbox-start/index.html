<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lightbox Start</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body
    style="margin:0;font:15px/24px Geist,system-ui,sans-serif;letter-spacing:-0.006em"
  >
    <div class="re-example w-full min-w-0">
      <div
        data-gallery=""
        class="re-gal [display:grid] [grid-template-columns:2fr_1fr_1fr] [grid-template-rows:172px_172px] [gap:6px] "
      >
        <a
          href="https://reuse.sh/images/marble-lake.svg"
          class="re-photo re-gal-main row-span-2 max-[600px]:row-auto max-[600px]:col-span-2"
          data-photo="lake"
          aria-label="Open Coral sky"
          ><img
            src="https://reuse.sh/images/marble-lake.svg"
            alt="A soft marble texture in coral, sand and blue"
            width="1600"
            height="1200"
            loading="lazy"
            draggable="false"
          ></a
        ><a
          href="https://reuse.sh/images/marble-mountains.svg"
          class="re-photo"
          data-photo="mountains"
          aria-label="Open Mint and ember"
          ><img
            src="https://reuse.sh/images/marble-mountains.svg"
            alt="A soft marble texture in mint, blue and orange"
            width="1600"
            height="1200"
            loading="lazy"
            draggable="false"
          ></a
        ><a
          href="https://reuse.sh/images/marble-coast.svg"
          class="re-photo"
          data-photo="coast"
          aria-label="Open Lilac bloom"
          ><img
            src="https://reuse.sh/images/marble-coast.svg"
            alt="A soft marble texture in lilac, rose and sea green"
            width="1600"
            height="1200"
            loading="lazy"
            draggable="false"
          ></a
        ><a
          href="https://reuse.sh/images/marble-forest.svg"
          class="re-photo"
          data-photo="forest"
          aria-label="Open Sand and fern"
          ><img
            src="https://reuse.sh/images/marble-forest.svg"
            alt="A soft marble texture in sand, green and violet"
            width="1600"
            height="1200"
            loading="lazy"
            draggable="false"
          ></a
        ><a
          href="https://reuse.sh/images/marble-night.svg"
          class="re-photo"
          data-photo="night"
          aria-label="Open Blue hour"
          ><img
            src="https://reuse.sh/images/marble-night.svg"
            alt="A soft marble texture in blue, lilac and gold"
            width="1600"
            height="1200"
            loading="lazy"
            draggable="false"
          ></a
        >
      </div>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
