<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Avatars Start</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body
    style="margin:0;font:15px/24px Geist,system-ui,sans-serif;letter-spacing:-0.006em"
  >
    <div
      class="re-example flex flex-col items-center justify-center w-full min-w-0"
    >
      <div class="flex flex-wrap items-center justify-center gap-10">
        <div>
          <span
            class="re-avatar"
            role="img"
            aria-label="Mara Lind, Available"
            data-re-avatar=""
            style="--re-avatar-size:64px"
            ><span
              class="re-avatar-face"
              data-re-avatar-face=""
              aria-hidden="true"
              >ML<img
                class="re-avatar-image"
                src="https://reuse.sh/images/marble-lake.svg"
                alt=""
                decoding="async"
              ></span
            ><span
              class="re-avatar-badge"
              data-re-avatar-badge="dot"
              data-corner="bottom-right"
              aria-hidden="true"
            ></span></span
          >
        </div>
        <div>
          <span
            class="re-avatar"
            role="img"
            aria-label="Sam Field, 128 unread messages"
            data-re-avatar=""
            style="--re-avatar-size:64px"
            ><span
              class="re-avatar-face"
              data-re-avatar-face=""
              aria-hidden="true"
              >SF<img
                class="re-avatar-image"
                src="https://reuse.sh/images/marble-mountains.svg"
                alt=""
                decoding="async"
              ></span
            ><span
              class="re-avatar-badge"
              data-re-avatar-badge="count"
              data-corner="bottom-right"
              aria-hidden="true"
              >128</span
            ></span
          >
        </div>
        <div>
          <span
            class="re-avatar"
            role="img"
            aria-label="Robin Park, Verified"
            data-re-avatar=""
            style="--re-avatar-size:64px"
            ><span
              class="re-avatar-face"
              data-re-avatar-face=""
              aria-hidden="true"
              >RP<img
                class="re-avatar-image"
                src="https://reuse.sh/images/marble-coast.svg"
                alt=""
                decoding="async"
              ></span
            ><span
              class="re-avatar-badge"
              data-re-avatar-badge="icon"
              data-corner="bottom-right"
              aria-hidden="true"
              ><svg
                width="12"
                height="12"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.6"
                aria-hidden="true"
              >
                <path
                  d="M5 14L8.5 17.5L19 6.5"
                  stroke="currentColor"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="1.6"
                ></path>
              </svg></span
            ></span
          >
        </div>
      </div>
      <div class="mt-8 flex flex-col items-center gap-[14px]">
        <span class="re-avatar-group"
          ><span
            class="re-avatar"
            role="img"
            aria-label="Alex Rivers"
            data-re-avatar=""
            style="--re-avatar-size:52px"
            ><span
              class="re-avatar-face"
              data-re-avatar-face=""
              aria-hidden="true"
              >AR<img
                class="re-avatar-image"
                src="https://reuse.sh/images/marble-forest.svg"
                alt=""
                decoding="async"
              ></span
            ></span
          ><span
            class="re-avatar"
            role="img"
            aria-label="Sam Field"
            data-re-avatar=""
            style="--re-avatar-size:52px"
            ><span
              class="re-avatar-face"
              data-re-avatar-face=""
              aria-hidden="true"
              >SF<img
                class="re-avatar-image"
                src="https://reuse.sh/images/marble-night.svg"
                alt=""
                decoding="async"
              ></span
            ></span
          ><span
            class="re-avatar"
            role="img"
            aria-label="Robin Park"
            data-re-avatar=""
            style="--re-avatar-size:52px"
            ><span
              class="re-avatar-face"
              data-re-avatar-face=""
              aria-hidden="true"
              >RP<img
                class="re-avatar-image"
                src="https://reuse.sh/images/marble-woods.svg"
                alt=""
                decoding="async"
              ></span
            ></span
          ><span
            class="re-avatar"
            role="img"
            aria-label="Taylor Reed"
            data-re-avatar=""
            style="--re-avatar-size:52px"
            ><span
              class="re-avatar-face"
              data-re-avatar-face=""
              aria-hidden="true"
              >TR<img
                class="re-avatar-image"
                src="https://reuse.sh/images/marble-lake.svg"
                alt=""
                decoding="async"
              ></span
            ></span
          ></span
        >
      </div>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
