<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>hold-delete-file</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body
    style="margin:0;font:15px/24px Geist,system-ui,sans-serif;letter-spacing:-0.006em"
  >
    <main class="re-example">
      <div class="re-hold-delete-file-x-file-wrap">
        <div class="re-hold-delete-file-x-file">
          <span class="re-hold-delete-file-x-file-icon" aria-hidden="true"
            ><svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              aria-hidden="true"
            >
              <path
                d="M16.5 2V5M7.5 2V5M12 2V5"
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="1.5"
              ></path>
              <path
                d="M13 3.5H11C7.70017 3.5 6.05025 3.5 5.02513 4.52513C4 5.55025 4 7.20017 4 10.5V15C4 18.2998 4 19.9497 5.02513 20.9749C6.05025 22 7.70017 22 11 22H13C16.2998 22 17.9497 22 18.9749 20.9749C20 19.9497 20 18.2998 20 15V10.5C20 7.20017 20 5.55025 18.9749 4.52512C17.9497 3.5 16.2998 3.5 13 3.5Z"
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="1.5"
              ></path>
              <path
                d="M8 15H12M8 11H16"
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="1.5"
              ></path>
            </svg></span
          ><span class="re-hold-delete-file-x-file-text"
            ><b class="re-hold-delete-file-x-file-name"
              >coral-sky-proof-03.tif</b
            ><small class="re-hold-delete-file-x-file-meta"
              >48.2 MB · Edited 2 hours ago by Mara Lind</small
            ></span
          >
          <div
            class="re-hold-delete-file-c-hold-wrap re-hold-delete-file-x-file-hold"
          >
            <button
              type="button"
              disabled=""
              class="re-hold re-hold-delete-file-c-hold"
            >
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                aria-hidden="true"
              >
                <path
                  d="M19.5 5.5L18.8803 15.5251C18.7219 18.0864 18.6428 19.3671 18.0008 20.2879C17.6833 20.7431 17.2747 21.1273 16.8007 21.416C15.8421 22 14.559 22 11.9927 22C9.42312 22 8.1383 22 7.17905 21.4149C6.7048 21.1257 6.296 20.7408 5.97868 20.2848C5.33688 19.3626 5.25945 18.0801 5.10461 15.5152L4.5 5.5"
                  stroke="currentColor"
                  stroke-linecap="round"
                  stroke-width="1.5"
                ></path>
                <path
                  d="M3 5.5H21M16.0557 5.5L15.3731 4.09173C14.9196 3.15626 14.6928 2.68852 14.3017 2.39681C14.215 2.3321 14.1231 2.27454 14.027 2.2247C13.5939 2 13.0741 2 12.0345 2C10.9688 2 10.436 2 9.99568 2.23412C9.8981 2.28601 9.80498 2.3459 9.71729 2.41317C9.32164 2.7167 9.10063 3.20155 8.65861 4.17126L8.05292 5.5"
                  stroke="currentColor"
                  stroke-linecap="round"
                  stroke-width="1.5"
                ></path>
                <path
                  d="M9.5 16.5L9.5 10.5"
                  stroke="currentColor"
                  stroke-linecap="round"
                  stroke-width="1.5"
                ></path>
                <path
                  d="M14.5 16.5L14.5 10.5"
                  stroke="currentColor"
                  stroke-linecap="round"
                  stroke-width="1.5"
                ></path>
              </svg><span>Hold to delete</span>
            </button>
          </div>
        </div>
        <div
          class="re-hold-delete-file-x-file re-hold-delete-file-x-file-gone"
          role="status"
          hidden
        >
          <p>
            <b class="re-hold-delete-file-x-file-gone-name"
              >coral-sky-proof-03.tif</b
            >
            was moved to the trash.
          </p>
          <button
            type="button"
            class="re-hold-delete-file-x-text-btn"
            id="undo"
          >
            Undo
          </button>
        </div>
        <p class="re-hold-delete-file-c-hold-hint">
          Release early, move off the button or press <kbd>Esc</kbd> to cancel.
        </p>
      </div>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
