<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Carousel example</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body
    style="margin:0;font:15px/24px Geist,system-ui,sans-serif;letter-spacing:-0.006em"
  >
    <main class="re-example re-c-product">
      <div class="re-c-head">
        <h2 id="series">More from the series</h2>
        <span class="re-c-arrows re-c-arrows-ring"
          ><button
            type="button"
            data-prev
            disabled
            aria-label="Previous prints"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="m12 19-7-7 7-7" />
              <path d="M19 12H5" />
            </svg>
          </button><button
            type="button"
            data-next
            disabled
            aria-label="Next prints"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M5 12h14" />
              <path d="m12 5 7 7-7 7" />
            </svg>
          </button></span
        >
      </div>
      <div>
        <section class="re-carousel" aria-label="Prints">
          <a
            class="re-carousel__slide re-c-print"
            href="#series"
            data-carousel-slide
            ><span class="re-c-print-img"
              ><img
                src="https://reuse.sh/images/marble-lake.svg"
                alt="A soft marble texture in coral, sand and blue"
                width="1600"
                height="1200"
                draggable="false"
                data-caption="Coral sky"
              ></span
            ><span class="re-c-print-name">Coral sky</span
            ><span class="re-c-print-price">From $84</span></a
          ><a
            class="re-carousel__slide re-c-print"
            href="#series"
            data-carousel-slide
            ><span class="re-c-print-img"
              ><img
                src="https://reuse.sh/images/marble-mountains.svg"
                alt="A soft marble texture in mint, blue and orange"
                width="1600"
                height="1200"
                draggable="false"
                data-caption="Mint and ember"
              ></span
            ><span class="re-c-print-name">Mint and ember</span
            ><span class="re-c-print-price">From $72</span></a
          ><a
            class="re-carousel__slide re-c-print"
            href="#series"
            data-carousel-slide
            ><span class="re-c-print-img"
              ><img
                src="https://reuse.sh/images/marble-night.svg"
                alt="A soft marble texture in blue, lilac and gold"
                width="1600"
                height="1200"
                draggable="false"
                data-caption="Blue hour"
              ></span
            ><span class="re-c-print-name">Blue hour</span
            ><span class="re-c-print-price">From $96</span></a
          ><a
            class="re-carousel__slide re-c-print"
            href="#series"
            data-carousel-slide
            ><span class="re-c-print-img"
              ><img
                src="https://reuse.sh/images/marble-forest.svg"
                alt="A soft marble texture in sand, green and violet"
                width="1600"
                height="1200"
                draggable="false"
                data-caption="Sand and fern"
              ></span
            ><span class="re-c-print-name">Sand and fern</span
            ><span class="re-c-print-price">From $64</span></a
          ><a
            class="re-carousel__slide re-c-print"
            href="#series"
            data-carousel-slide
            ><span class="re-c-print-img"
              ><img
                src="https://reuse.sh/images/marble-woods.svg"
                alt="A soft marble texture in orange, yellow and blue"
                width="1600"
                height="1200"
                draggable="false"
                data-caption="Amber"
              ></span
            ><span class="re-c-print-name">Amber</span
            ><span class="re-c-print-price">From $88</span></a
          ><a
            class="re-carousel__slide re-c-print"
            href="#series"
            data-carousel-slide
            ><span class="re-c-print-img"
              ><img
                src="https://reuse.sh/images/marble-coast.svg"
                alt="A soft marble texture in lilac, rose and sea green"
                width="1600"
                height="1200"
                draggable="false"
                data-caption="Lilac bloom"
              ></span
            ><span class="re-c-print-name">Lilac bloom</span
            ><span class="re-c-print-price">From $72</span></a
          >
        </section>
      </div>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
