<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Annotations Editor</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body
    style="margin:0;font:15px/24px Geist,system-ui,sans-serif;letter-spacing:-0.006em"
  >
    <div class="re-example re-editor-doc [display:grid] [gap:20px] ">
      <div
        class="re-annotation-editor re-annot [--re-annotation-color:#d95746] [--re-annotation-radius:10px] [font-size:13px] re-annot-edit"
      >
        <fieldset class="re-annotation-toolbar" aria-label="Annotation tools">
          <button
            type="button"
            disabled
            aria-label="Select"
            aria-pressed="true"
          >
            Select
          </button><button
            type="button"
            disabled
            aria-label="Area"
            aria-pressed="false"
          >
            Area
          </button><button
            type="button"
            disabled
            aria-label="Spotlight"
            aria-pressed="false"
          >
            Spotlight
          </button><button
            type="button"
            disabled
            aria-label="Arrow"
            aria-pressed="false"
          >
            Arrow
          </button><button
            type="button"
            disabled
            aria-label="Line"
            aria-pressed="false"
          >
            Line
          </button><button
            type="button"
            disabled
            aria-label="Pointer"
            aria-pressed="false"
          >
            Pointer
          </button><button
            type="button"
            disabled
            aria-label="Marker"
            aria-pressed="false"
          >
            Marker
          </button><button type="button" disabled>Undo</button
          ><button type="button" disabled>Redo</button
          ><button type="button" disabled>Delete</button>
        </fieldset>
        <section aria-label="Edit image annotations">
          <div>
            <figure data-re-annotations>
              <div data-annot-stage>
                <div data-annot-media>
                  <img
                    src="https://reuse.sh/images/marble-lake.svg"
                    alt="A soft marble texture in coral, sand and blue, with editable marks"
                  >
                  <div data-annotation-overlay>
                    <span
                      data-annot-area=""
                      data-index="0"
                      style="left: 10%; top: 14%; width: 30%; height: 30%"
                      ><span data-annot-tag="">Crop line</span></span
                    ><span
                      data-annot-shape="arrow"
                      data-index="1"
                      data-line="70 74 52 56"
                      style="left: 70%; top: 74%; width: 22.5%; --angle: -143.1deg"
                      aria-hidden="true"
                    ></span>
                  </div>
                </div>
              </div>
            </figure>
          </div>
        </section>
        <p class="re-annotation-editor-hint">
          Choose a tool, then click or drag on the image. Select a mark to move
          it. Arrow keys move the selection, Delete removes it, and Escape
          cancels.
        </p>
      </div>
      <div
        class="re-saved [overflow:hidden] [border-radius:12px] [background:var(--re-demo-surface)] [box-shadow:var(--re-demo-shadow-raised)]"
      >
        <p
          class="re-saved-head [display:flex] [justify-content:space-between] [padding:10px_14px_0] [font-size:12.5px] [color:var(--re-demo-mute)]"
        >
          <b class="re-saved-label [color:var(--re-demo-ink)] [font-weight:560]"
            >Saved</b
          ><span aria-live="polite">2 marks</span>
        </p>
        <pre
          class="re-saved-code [max-height:140px] [padding:8px_14px_14px] [overflow:auto] [font-family:var(--re-demo-mono)] [font-size:12px] [line-height:19px] [white-space:pre-wrap] [word-break:break-all] [color:var(--re-demo-prose)]"
        ><code>{&quot;version&quot;:1,&quot;annotations&quot;:[{&quot;kind&quot;:&quot;area&quot;,&quot;box&quot;:[10,14,30,30],&quot;label&quot;:&quot;Crop line&quot;},{&quot;kind&quot;:&quot;arrow&quot;,&quot;line&quot;:[70,74,52,56]}]}</code></pre>
      </div>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
