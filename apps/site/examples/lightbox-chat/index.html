<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lightbox Chat</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body
    style="margin:0;font:15px/24px Geist,system-ui,sans-serif;letter-spacing:-0.006em"
  >
    <div class="re-example w-full min-w-0">
      <div
        class="re-chat [display:grid] [grid-template-columns:228px_minmax(0,_1fr)]  [overflow:hidden] [border-radius:16px] [background:var(--re-demo-surface)] [box-shadow:var(--re-demo-shadow-panel)]"
      >
        <div
          class="re-list [padding:14px_8px] [background:#fafaf9] [box-shadow:inset_-1px_0_rgb(0_0_0_/_6%)]"
        >
          <p
            class="re-list-title [padding:2px_8px_10px] [font-size:13px] [font-weight:600]"
          >
            Messages
          </p>
          <div
            class="re-list-rows [--re-highlight-background:var(--re-demo-hover)] [--re-highlight-radius:10px] [display:grid] [gap:2px]"
          >
            <button
              type="button"
              disabled=""
              class="re-person [display:grid] [grid-template-columns:36px_minmax(0,_1fr)_auto] [align-items:center] [gap:10px] [padding:8px] [border:0] [border-radius:10px] [background:transparent] [text-align:left] [cursor:pointer]"
              data-re-row="true"
              data-current=""
              aria-current="true"
            >
              <span
                class="re-avatar"
                role="img"
                aria-label="Mara Lind"
                data-re-avatar=""
                style="--re-avatar-size:36px"
                ><span
                  class="re-avatar-face"
                  data-re-avatar-face=""
                  aria-hidden="true"
                  >ML<img
                    class="re-avatar-image"
                    src="https://reuse.sh/images/marble-lake.svg"
                    alt=""
                    decoding="async"
                  ></span
                ></span
              ><span class="re-person-text [display:grid] [min-width:0]"
                ><b>Mara Lind</b
                ><small>Proofs from the new series, finally</small></span
              ><time>18:42</time>
            </button><button
              type="button"
              disabled=""
              class="re-person [display:grid] [grid-template-columns:36px_minmax(0,_1fr)_auto] [align-items:center] [gap:10px] [padding:8px] [border:0] [border-radius:10px] [background:transparent] [text-align:left] [cursor:pointer]"
              data-re-row="true"
            >
              <span
                class="re-avatar"
                role="img"
                aria-label="Jonas Weber"
                data-re-avatar=""
                style="--re-avatar-size:36px"
                ><span
                  class="re-avatar-face"
                  data-re-avatar-face=""
                  aria-hidden="true"
                  >JW<img
                    class="re-avatar-image"
                    src="https://reuse.sh/images/marble-mountains.svg"
                    alt=""
                    decoding="async"
                  ></span
                ></span
              ><span class="re-person-text [display:grid] [min-width:0]"
                ><b>Jonas Weber</b
                ><small>Invoice is in the shared folder</small></span
              ><time>16:05</time>
            </button><button
              type="button"
              disabled=""
              class="re-person [display:grid] [grid-template-columns:36px_minmax(0,_1fr)_auto] [align-items:center] [gap:10px] [padding:8px] [border:0] [border-radius:10px] [background:transparent] [text-align:left] [cursor:pointer]"
              data-re-row="true"
            >
              <span
                class="re-avatar"
                role="img"
                aria-label="Aiko Tanaka"
                data-re-avatar=""
                style="--re-avatar-size:36px"
                ><span
                  class="re-avatar-face"
                  data-re-avatar-face=""
                  aria-hidden="true"
                  >AT<img
                    class="re-avatar-image"
                    src="https://reuse.sh/images/marble-coast.svg"
                    alt=""
                    decoding="async"
                  ></span
                ></span
              ><span class="re-person-text [display:grid] [min-width:0]"
                ><b>Aiko Tanaka</b><small>See you at ten</small></span
              ><time>Thu</time>
            </button><button
              type="button"
              disabled=""
              class="re-person [display:grid] [grid-template-columns:36px_minmax(0,_1fr)_auto] [align-items:center] [gap:10px] [padding:8px] [border:0] [border-radius:10px] [background:transparent] [text-align:left] [cursor:pointer]"
              data-re-row="true"
            >
              <span
                class="re-avatar"
                role="img"
                aria-label="Lea Novak"
                data-re-avatar=""
                style="--re-avatar-size:36px"
                ><span
                  class="re-avatar-face"
                  data-re-avatar-face=""
                  aria-hidden="true"
                  >LN<img
                    class="re-avatar-image"
                    src="https://reuse.sh/images/marble-forest.svg"
                    alt=""
                    decoding="async"
                  ></span
                ></span
              ><span class="re-person-text [display:grid] [min-width:0]"
                ><b>Lea Novak</b><small>Thanks, that works</small></span
              ><time>Tue</time>
            </button>
          </div>
        </div>
        <div
          class="re-thread [display:grid] [grid-template-rows:auto_minmax(0,_1fr)_auto] [min-width:0]"
        >
          <div
            class="re-thread-head [display:flex] [align-items:center] [gap:10px] [padding:12px_16px] [box-shadow:inset_0_-1px_rgb(0_0_0_/_6%)]"
          >
            <span
              class="re-avatar"
              role="img"
              aria-label="Mara Lind, Online"
              data-re-avatar=""
              style="--re-avatar-size:32px"
              ><span
                class="re-avatar-face"
                data-re-avatar-face=""
                aria-hidden="true"
                >ML<img
                  class="re-avatar-image"
                  src="https://reuse.sh/images/marble-lake.svg"
                  alt=""
                  decoding="async"
                ></span
              ><span
                class="re-avatar-badge"
                data-re-avatar-badge="dot"
                data-corner="bottom-right"
                aria-hidden="true"
              ></span></span
            ><span><b>Mara Lind</b><small>Active now</small></span>
          </div>
          <div
            data-gallery=""
            class="re-msgs [display:flex] [flex-direction:column] [gap:6px] [padding:16px] [overflow:hidden]"
          >
            <span class="re-day [align-self:center] [margin-bottom:6px]"
              >Sunday 18:42</span
            >
            <p
              class="re-msg [align-self:flex-start] [max-width:74%] [padding:8px_12px] [border-radius:18px_18px_18px_6px] [background:#efefee] [font-size:14px] [line-height:20px]"
            >
              Proofs from the new series, finally
            </p>
            <div
              class="re-tiles [display:grid] [grid-template-columns:2fr_1fr] [grid-template-rows:1fr_1fr] [gap:3px] [width:min(320px,_78%)] [aspect-ratio:3_/_2] [overflow:hidden] [border-radius:18px]"
              data-photo-group="true"
            >
              <a
                href="https://reuse.sh/images/marble-lake.svg"
                class="re-photo"
                data-photo="lake"
                aria-label="Open Coral sky"
                ><img
                  src="https://reuse.sh/images/marble-lake.svg"
                  alt="A soft marble texture in coral, sand and blue"
                  width="1600"
                  height="1200"
                  loading="lazy"
                  draggable="false"
                ></a
              ><a
                href="https://reuse.sh/images/marble-coast.svg"
                class="re-photo"
                data-photo="coast"
                aria-label="Open Lilac bloom"
                ><img
                  src="https://reuse.sh/images/marble-coast.svg"
                  alt="A soft marble texture in lilac, rose and sea green"
                  width="1600"
                  height="1200"
                  loading="lazy"
                  draggable="false"
                ></a
              ><a
                href="https://reuse.sh/images/marble-woods.svg"
                class="re-photo"
                data-photo="woods"
                aria-label="Open Amber"
                ><img
                  src="https://reuse.sh/images/marble-woods.svg"
                  alt="A soft marble texture in orange, yellow and blue"
                  width="1600"
                  height="1200"
                  loading="lazy"
                  draggable="false"
                ><span
                  class="re-more [position:absolute] [inset:0] [display:grid] [place-items:center] [background:rgb(0_0_0_/_42%)] [color:#fff] [font-size:18px] [font-weight:560]"
                  >+3</span
                ></a
              ><a
                href="https://reuse.sh/images/marble-mountains.svg"
                class="re-photo"
                data-photo="mountains"
                aria-label="Open Mint and ember"
                hidden=""
                tabindex="-1"
                ><img
                  src="https://reuse.sh/images/marble-mountains.svg"
                  alt="A soft marble texture in mint, blue and orange"
                  width="1600"
                  height="1200"
                  loading="lazy"
                  draggable="false"
                ></a
              ><a
                href="https://reuse.sh/images/marble-forest.svg"
                class="re-photo"
                data-photo="forest"
                aria-label="Open Sand and fern"
                hidden=""
                tabindex="-1"
                ><img
                  src="https://reuse.sh/images/marble-forest.svg"
                  alt="A soft marble texture in sand, green and violet"
                  width="1600"
                  height="1200"
                  loading="lazy"
                  draggable="false"
                ></a
              ><a
                href="https://reuse.sh/images/marble-night.svg"
                class="re-photo"
                data-photo="night"
                aria-label="Open Blue hour"
                hidden=""
                tabindex="-1"
                ><img
                  src="https://reuse.sh/images/marble-night.svg"
                  alt="A soft marble texture in blue, lilac and gold"
                  width="1600"
                  height="1200"
                  loading="lazy"
                  draggable="false"
                ></a
              >
            </div>
            <p
              class="re-msg [align-self:flex-start] [max-width:74%] [padding:8px_12px] [border-radius:18px_18px_18px_6px] [background:#efefee] [font-size:14px] [line-height:20px] re-me [align-self:flex-end] [margin-top:6px] [border-radius:18px_18px_6px_18px] [background:#1f6feb] [color:#fff]"
            >
              The coral one is my favorite
            </p>
            <span class="re-read [align-self:flex-end] [margin-top:-2px]"
              >Read 18:44</span
            >
            <div
              class="re-single [width:min(220px,_62%)] [overflow:hidden] [border-radius:18px]"
              data-photo-group="true"
            >
              <a
                href="https://reuse.sh/images/marble-night.svg"
                class="re-photo"
                data-photo="night"
                aria-label="Open Blue hour"
                ><img
                  src="https://reuse.sh/images/marble-night.svg"
                  alt="A soft marble texture in blue, lilac and gold"
                  width="1600"
                  height="1200"
                  loading="lazy"
                  draggable="false"
                ></a
              >
            </div>
            <p
              class="re-msg [align-self:flex-start] [max-width:74%] [padding:8px_12px] [border-radius:18px_18px_18px_6px] [background:#efefee] [font-size:14px] [line-height:20px]"
            >
              And the last one, in blue and gold
            </p>
          </div>
          <div
            class="re-compose [display:flex] [align-items:center] [gap:8px] [margin:0_12px_12px] [padding:4px_4px_4px_14px] [border-radius:20px] [box-shadow:inset_0_0_0_1px_rgb(0_0_0_/_10%)]"
          >
            <input
              type="text"
              placeholder="Message Mara"
              aria-label="Message Mara"
            ><button
              disabled=""
              type="button"
              aria-label="Send"
              data-re-tooltip="Send"
            >
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                aria-hidden="true"
              >
                <path
                  d="M12 19V5m0 0-6 6m6-6 6 6"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                ></path>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
