<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>tooltip-links</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body
    style="margin:0;font:15px/24px Geist,system-ui,sans-serif;letter-spacing:-0.006em"
  >
    <main class="re-example">
      <div>
        <article class="re-tooltip-links-x-story">
          <p class="re-tooltip-links-x-date">Print series · October 2026</p>
          <h2 class="re-tooltip-links-x-j-title">Three prints from one tray</h2>
          <p class="re-tooltip-links-x-j-text">
            The series opens with
            <a
              href="#links-note"
              class="re-tooltip-links-c-link"
              data-re-tooltip-template="tt-print-coral"
              >Coral sky</a
            >, the first sheet we pulled.
            <a
              href="#links-note"
              class="re-tooltip-links-c-link"
              data-re-tooltip-template="tt-print-mint"
              >Mint and ember</a
            >
            came from the same water an hour later.
            <a
              href="#links-note"
              class="re-tooltip-links-c-link"
              data-re-tooltip-template="tt-print-lilac"
              >Lilac bloom</a
            >
            was the last, once the colors had softened.
          </p>
          <p class="re-tooltip-links-x-j-text" id="links-note">
            Point at a print name to see it.
          </p>
        </article>
      </div>
      <template id="tt-print-coral"
        ><span class="re-tooltip-links-f-card"
          ><img
            src="https://reuse.sh/images/marble-lake.svg"
            alt=""
            width="1600"
            height="1200"
          ><span class="re-tooltip-links-f-card-body"
            ><b>Coral sky</b
            ><span
              >The first sheet pulled from the tray. Coral and sand over a cool
              blue.</span
            ><small>prints.example.com</small></span
          ></span
        ></template
      ><template id="tt-print-mint"
        ><span class="re-tooltip-links-f-card"
          ><img
            src="https://reuse.sh/images/marble-mountains.svg"
            alt=""
            width="1600"
            height="1200"
          ><span class="re-tooltip-links-f-card-body"
            ><b>Mint and ember</b
            ><span
              >Pulled an hour later, after the orange had sunk to the
              bottom.</span
            ><small>prints.example.com</small></span
          ></span
        ></template
      ><template id="tt-print-lilac"
        ><span class="re-tooltip-links-f-card"
          ><img
            src="https://reuse.sh/images/marble-coast.svg"
            alt=""
            width="1600"
            height="1200"
          ><span class="re-tooltip-links-f-card-body"
            ><b>Lilac bloom</b
            ><span
              >The last sheet of the day, once the colors had softened.</span
            ><small>prints.example.com</small></span
          ></span
        ></template
      >
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
