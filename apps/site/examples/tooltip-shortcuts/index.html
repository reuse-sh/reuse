<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tooltip Shortcuts</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<main class="re-example"><div class="re-surface"><img class="re-photo" src="https://reuse.sh/images/marble-mountains.svg" alt="A soft marble texture in mint, blue and orange"><div class="re-toolbar" role="toolbar" aria-label="Photo actions"><button type="button" class="re-control" aria-label="Zoom in" data-re-row data-re-tooltip="Zoom in ⌘+">+</button><button type="button" class="re-control" aria-label="Zoom out" data-re-row data-re-tooltip="Zoom out ⌘−">−</button><button type="button" class="re-control" aria-label="Duplicate" data-re-row data-re-tooltip="Duplicate ⌘D">▣</button><button type="button" class="re-control" aria-label="Copy link" data-re-row data-re-tooltip="Copy link ⌘L">↗</button><button type="button" class="re-control" aria-label="Share" data-re-row data-re-tooltip="Share ⇧⌘S">↑</button><button type="button" class="re-control" aria-label="Delete" data-re-row data-re-tooltip="Delete ⌫">×</button></div></div></main>
<script type="module" src="./main.js"></script>
</body>
</html>
