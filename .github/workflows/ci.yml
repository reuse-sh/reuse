name: Checks

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec turbo run build --filter=@reuse-sh/lightbox
        env:
          TURBO_CONCURRENCY: "1"
      - name: Trace offset setup on the baseline
        run: pnpm test:browser tests/browser/performance.spec.ts --project chromium-desktop --grep @timing --repeat-each=5 --workers=1 --reporter=line
      - name: Configure the internal offset opt-out before creation
        id: initial_offsets
        if: always() && !cancelled()
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          carousel = Path("packages/carousel/src/index.ts")
          source = carousel.read_text()
          source = source.replace('  let publishesOffsets = true;', '  const publishesOffsets = Reflect.get(initialOptions, internalKey) !== "omitOffsets";')
          start = source.index('    omitOffsets: () => {')
          end = source.index('    },', start) + len('    },\n')
          carousel.write_text(source[:start] + source[end:])
          internal = Path("packages/carousel/src/internal.ts")
          internal.write_text(internal.read_text().replace("  omitOffsets(): void;\n", ""))
          lightbox = Path("packages/lightbox/src/index.ts")
          source = lightbox.read_text()
          start = source.index("  function connect(viewport:")
          source = source[:start] + source[start:].replace("    const carousel = createCarousel(viewport, {", "    const options = {\n      [carouselInternals]: \"omitOffsets\",", 1).replace("    });", "    };\n    const carousel = createCarousel(viewport, options);", 1)
          lightbox.write_text(source.replace("    internals?.omitOffsets?.();\n", ""))
          PYCODE
          pnpm exec turbo run build --filter=@reuse-sh/lightbox
        env:
          TURBO_CONCURRENCY: "1"
      - name: Trace opening with offsets disabled before creation
        if: always() && !cancelled() && steps.initial_offsets.outcome == 'success'
        run: pnpm test:browser tests/browser/performance.spec.ts --project chromium-desktop --grep @timing --repeat-each=5 --workers=1 --reporter=line
