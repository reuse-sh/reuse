name: Checks

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec turbo run build --filter=@reuse-sh/lightbox
        env:
          TURBO_CONCURRENCY: "1"
      - name: Trace opening with a cold font
        run: pnpm test:browser tests/browser/performance.spec.ts --project chromium-desktop -g 'pages ten photos, zooms and closes' --repeat-each=6 --workers=1 --reporter=line
      - name: Prepare fixture font
        id: fixture_font
        if: always() && !cancelled()
        run: |
          sed -i '/await page.locator("#gallery img").first().hover();/a\      await page.evaluate(() => { const canvas = document.createElement("canvas").getContext("2d"); if (!canvas) throw new Error("Canvas unavailable"); canvas.font = "16px system-ui"; canvas.measureText("1 / 11"); });' tests/browser/performance.spec.ts
          git diff --exit-code -- tests/browser/performance.spec.ts && exit 1
      - name: Trace opening after reading the fixture font
        if: always() && !cancelled() && steps.fixture_font.outcome == 'success'
        run: pnpm test:browser tests/browser/performance.spec.ts --project chromium-desktop -g 'pages ten photos, zooms and closes' --repeat-each=6 --workers=1 --reporter=line
