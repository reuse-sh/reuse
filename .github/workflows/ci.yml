name: Checks

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec turbo run build --filter=@reuse-sh/lightbox
        env:
          TURBO_CONCURRENCY: "1"
      - name: Trace gesture order on the baseline
        run: pnpm test:browser tests/browser/performance.spec.ts --project chromium-desktop --grep 'opens 1000 photos' --repeat-each=6 --workers=1 --reporter=line
      - name: Move the gesture handler before carousel style writes
        id: gesture_order
        if: always() && !cancelled()
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          p = Path("packages/lightbox/src/index.ts")
          s = p.read_text()
          measure = s.index("        if (!s.pointers.size) measure(s);")
          offset = s.index("      { signal },", measure)
          p.write_text(s[:offset] + s[offset:].replace("      { signal },", "      { signal, capture: true },", 1))
          PYCODE
          pnpm exec turbo run build --filter=@reuse-sh/lightbox
        env:
          TURBO_CONCURRENCY: "1"
      - name: Trace gesture order after capture
        if: always() && !cancelled() && steps.gesture_order.outcome == 'success'
        run: pnpm test:browser tests/browser/performance.spec.ts --project chromium-desktop --grep 'opens 1000 photos' --repeat-each=6 --workers=1 --reporter=line
