name: Checks

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec turbo run build --filter=@reuse-sh/lightbox
        env:
          TURBO_CONCURRENCY: "1"
      - name: Trace baseline pointer holds
        run: pnpm test:browser tests/browser/performance.spec.ts --project chromium-desktop --grep @timing --repeat-each=5 --workers=1 --reporter=line
      - name: Remove redundant pointer hold publication
        id: pointer_hold
        if: always() && !cancelled()
        run: |
          sed -i '/^  function internalHold(/,/^  }/ s/^    schedule();$/    if (reason !== "pointer" || options.autoplay !== undefined) schedule();/' packages/carousel/src/index.ts
          git diff --exit-code -- packages/carousel/src/index.ts && exit 1
          pnpm exec turbo run build --filter=@reuse-sh/lightbox
        env:
          TURBO_CONCURRENCY: "1"
      - name: Trace optimized pointer holds
        if: always() && !cancelled() && steps.pointer_hold.outcome == 'success'
        run: pnpm test:browser tests/browser/performance.spec.ts --project chromium-desktop --grep @timing --repeat-each=5 --workers=1 --reporter=line
