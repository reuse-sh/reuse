name: Checks

on:
  workflow_call:
    inputs:
      browser-test-path:
        description: Path to the browser tests to run
        type: string
        default: ""
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: blacksmith-2vcpu-ubuntu-2604
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-resolute
      options: --ipc=host
    timeout-minutes: 30
    steps:
      - uses: useblacksmith/checkout@v1
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          # Firefox requires the container user to own the home directory mounted by GitHub.
          chown "$(id -u):$(id -g)" /github/home
          pnpm check
        env:
          TURBO_CONCURRENCY: "1"
          REUSE_BROWSER_TEST_PATH: ${{ inputs.browser-test-path }}
