name: Checks

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit firefox
      - run: pnpm lint && pnpm type-check && pnpm test && pnpm build
        env:
          TURBO_CONCURRENCY: "1"
      - name: Trace before ordinary browser tests
        run: pnpm test:browser tests/browser/performance.spec.ts --project chromium-desktop --grep @timing --repeat-each=3 --workers=1 --reporter=line
        env:
          REUSE_PROBE_HOVER: "1"
      - name: Run ordinary browser tests
        if: always() && !cancelled()
        run: pnpm test:browser --grep-invert @timing
      - name: Trace after ordinary browser tests
        if: always() && !cancelled()
        run: pnpm test:browser tests/browser/performance.spec.ts --project chromium-desktop --grep @timing --repeat-each=3 --workers=1 --reporter=line
        env:
          REUSE_PROBE_HOVER: "1"
