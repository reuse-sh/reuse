name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  plan:
    runs-on: blacksmith-2vcpu-ubuntu-2604
    timeout-minutes: 5
    outputs:
      action: ${{ steps.plan.outputs.action }}
    steps:
      - uses: useblacksmith/checkout@v1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - id: plan
        run: node scripts/release-plan.mjs >> "$GITHUB_OUTPUT"

  check:
    needs: plan
    if: needs.plan.outputs.action == 'publish'
    uses: ./.github/workflows/ci.yml

  release:
    needs: [plan, check]
    if: >-
      !cancelled() && (needs.plan.outputs.action == 'version' ||
      (needs.plan.outputs.action == 'publish' && needs.check.result == 'success'))
    runs-on: blacksmith-2vcpu-ubuntu-2604
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: useblacksmith/checkout@v1
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
